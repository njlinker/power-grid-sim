name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # VeraGridEngine 6.0.22 requires networkx>=3.6.1, which needs
        # Python >= 3.11. Python 3.10 is no longer in the supported matrix.
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            graphviz \
            build-essential \
            python3-dev \
            cmake \
            libopenblas-dev \
            libhdf5-dev \
            libproj-dev \
            libxml2-dev \
            libxslt1-dev \
            libssl-dev \
            libffi-dev \
            libfreetype-dev \
            libpng-dev \
            libjpeg-dev

      - name: Install Python dependencies
        run: |
          set -o pipefail
          python -m pip install --upgrade pip setuptools wheel

          # VeraGrid 6.0.22 only publishes an sdist on PyPI for Linux, and its
          # setup.py needs to import VeraGridEngine to read the version. In
          # the PEP 517 isolated build env VeraGridEngine is not installed
          # yet, so the metadata step fails with
          #   ERROR: Failed to build 'VeraGrid' when getting requirements to
          #   build wheel
          #
          # Fix: pre-install VeraGridEngine in the main env (it has no
          # build-time imports of its own), then install VeraGrid with
          # --no-build-isolation so the build env can see VeraGridEngine.
          log=/tmp/pip-install.log

          echo "--- pre-installing VeraGridEngine (no isolation) ---"
          pip install --no-build-isolation --no-cache-dir \
            'VeraGridEngine==6.0.22' 2>&1 | tee -a "$log"

          echo "--- installing full requirements (no build isolation) ---"
          pip install --no-build-isolation --no-cache-dir \
            -r requirements.txt 2>&1 | tee -a "$log" \
            || (echo "::error::pip install failed; last 200 lines:"; \
                tail -n 200 "$log"; exit 1)

          pip install pytest pytest-cov

      - name: Run tests with coverage
        run: |
          pytest --cov=lab_scripts --cov-report=xml --cov-report=term

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          file: coverage.xml
          flags: unittests
          fail_ci_if_error: false

      - name: Run sanity demo (verify install)
        run: |
          python lab_scripts/exp03_event_driven_sim.py > /tmp/exp03.log 2>&1 || \
            (cat /tmp/exp03.log && exit 1)
