name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            graphviz \
            build-essential \
            python3-dev \
            cmake \
            libopenblas-dev \
            libhdf5-dev \
            libproj-dev \
            libxml2-dev \
            libxslt1-dev \
            libssl-dev \
            libffi-dev \
            libfreetype-dev \
            libpng-dev \
            libjpeg-dev

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          # VeraGrid 6.0.22 ships only an sdist on PyPI for Linux — pip must
          # build it from source, which transitively builds VeraGridEngine
          # (highspy, numba, h5py, pyproj, lxml, ...). The system dev packages
          # above supply the missing C headers.
          pip install --prefer-binary -r requirements.txt
          pip install pytest pytest-cov

      - name: Run tests with coverage
        run: |
          pytest --cov=lab_scripts --cov-report=xml --cov-report=term

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          file: coverage.xml
          flags: unittests
          fail_ci_if_error: false

      - name: Run sanity demo (verify install)
        run: |
          python lab_scripts/exp03_event_driven_sim.py > /tmp/exp03.log 2>&1 || \
            (cat /tmp/exp03.log && exit 1)
